apiVersion: v1
kind: Pod
metadata:
  name: allowed-sysctl
  annotations:
    expected.pod-security.cybozu.com/baseline: ""
    expected.pod-security.cybozu.com/hostpath: ""
    expected.pod-security.cybozu.com/privileged: ""
    expected.pod-security.cybozu.com/restricted: "denied the request: spec.securityContext.sysctls[1]: Forbidden: Setting sysctl net.core.somaxconn is not allowed"
spec:
  securityContext:
    runAsNonRoot: true
    sysctls:
      - name: kernel.shm_rmid_forced
        value: "1"
      - name: net.core.somaxconn
        value: "1024"
  containers:
    - name: ubuntu
      image: ghcr.io/cybozu/ubuntu
