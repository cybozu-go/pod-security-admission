apiVersion: v1
kind: Pod
metadata:
  name: sysctl-safe2
  annotations:
    expected.pod-security.cybozu.com/baseline: ""
    expected.pod-security.cybozu.com/hostpath: ""
    expected.pod-security.cybozu.com/privileged: ""
    expected.pod-security.cybozu.com/restricted: ""
spec:
  securityContext:
    runAsNonRoot: true
    sysctls:
      - name: net.ipv4.ping_group_range
        value: "100 100"
      - name: net.ipv4.ip_local_reserved_ports
        value: "8080,9148"
      - name: net.ipv4.tcp_keepalive_time
        value: "100"
      - name: net.ipv4.tcp_fin_timeout
        value: "10"
      - name: net.ipv4.tcp_keepalive_intvl
        value: "60"
      - name: net.ipv4.tcp_keepalive_probes
        value: "5"
      - name: net.ipv4.tcp_rmem
        value: "4096 87380 6291456"
      - name: net.ipv4.tcp_wmem
        value: "4096 16384 4194304"
  containers:
    - name: ubuntu
      image: ghcr.io/cybozu/ubuntu
